<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Segoe UI'; background: #f0f4f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 380px; text-align: center; }
        .logo { font-size: 30px; margin-bottom: 20px; }
        input { width: 100%; padding: 15px; margin: 10px 0; border: 1.5px solid #eee; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #4e73df; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #2e59d9; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">🩺</div>
        <h2 style="color: #4e73df;">SymptomWise AI</h2>
        <p style="color: #666; margin-bottom: 30px;">Professional Patient Portal</p>
        <form action="/auth" method="post">
            <input type="text" name="username" placeholder="Patient Name" required>
            <input type="password" placeholder="Password" required>
            <button type="submit">Log In</button>
        </form>
    </div>
</body>
</html>
