<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Segoe UI'; background: #f8f9fc; margin: 0; }
        .navbar { background: #4e73df; color: white; padding: 15px 50px; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 800px; margin: 50px auto; padding: 30px; background: white; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .symptom-row { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid #f1f1f1; align-items: center; }
        .btn { display: block; width: 100%; padding: 15px; background: #1cc88a; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 30px; }
        .history-btn { color: white; text-decoration: none; background: #36b9cc; padding: 8px 15px; border-radius: 5px; margin-right: 15px; font-size: 14px; }
        .history-btn:hover { background: #2c9faf; }
    </style>
</head>
<body>
    <div class="navbar">
        <span style="font-size: 20px; font-weight: bold;">🩺 AI Symptom Checker</span>
        <div>
            <a href="/history" class="history-btn">📜 View History</a>
            <span>Patient: <b>{{ user }}</b> | <a href="/logout" style="color: white; text-decoration: none;">Logout</a></span>
        </div>
    </div>
    <div class="container">
        <h2 style="color: #4e73df;">Medical Diagnosis Dashboard</h2>
        <p style="color: #858796;">Please select the symptoms you are currently experiencing:</p>
        <form action="/predict" method="post">
            {% for s in symptoms %}
            <div class="symptom-row">
                <span style="font-size: 17px;">Do you have <b>{{ s | capitalize }}</b>?</span>
                <input type="checkbox" name="symptoms" value="{{ s }}" style="width: 22px; height: 22px;">
            </div>
            {% endfor %}
            <button type="submit" class="btn">Predict Disease & View Report</button>
        </form>
    </div>
</body>
</html>
